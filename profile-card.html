<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Profile Card</title>
    <link rel="stylesheet" href="profile-style.css">
</head>
<body>

    <div class="profile-card">

        <!-- Nama dan pekerjaan -->
        <div class="card-info">
            <h2>Harsiah</h2>
            <p>Frontend Developer</p>
            <div class="line"></div>
        </div>

        <!-- Foto profil -->
        <img
            src="image/isha cyber.jpeg"
            alt="Profile photo"
            class="profile-image"
        >

        <!-- Informasi kontak -->
        <div class="contact-info">

            <!-- Nomor telepon -->
            <div class="contact-item">
                <span class="contact-icon">☎</span>
                <div>
                    <p>+62 821 9911 3274</p>
                </div>
            </div>

            <!-- Website -->
            <div class="contact-item">
                <span class="contact-icon">🌐</span>
                <div>
                    <p>www.ishamart.com</p>
                </div>
            </div>

            <!-- Email -->
            <div class="contact-item">
                <span class="contact-icon">✉</span>
                <div>
                    <p>harsiah04@mail.com</p>
                </div>
            </div>

        </div>

        <!-- Informasi alamat -->
        <div class="address-info">
            <span class="address-icon">📍</span>
            <div>
                <p>Jl. Raya Kuta No. 20</p>
                <p>Bali, Indonesia</p>
            </div>
        </div>

        <!-- Bagian bawah gradasi biru -->
        <div class="card-bottom"></div>

    </div>

</body>
</html>
